<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Live Character Counter</h1>
        <p>Write your note and keep track of your characters and words.</p>
    </header>

    <main>
        <section>
            <label for="note-text">Your Note</label>

            <textarea
                id="note-text"
                placeholder="Start writing your note..."
                rows="10"
            ></textarea>

            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>

            <div>
                <button id="clear-btn" type="button">Clear</button>
                <button id="theme-toggle" type="button">Dark mode</button>
            </div>
        </section>
    </main>

</body>
</html>
